spring.application.name=upro-duel
server.port=${PORT:8080}

# Local defaults; in production set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
spring.datasource.url=jdbc:postgresql://localhost:5432/upro
spring.datasource.username=upro
spring.datasource.password=upro

# Comma-separated origin patterns allowed to open the WebSocket, e.g. https://uproduel.vercel.app
app.allowed-origins=${ALLOWED_ORIGINS:*}
